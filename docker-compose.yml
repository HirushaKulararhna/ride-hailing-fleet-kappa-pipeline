version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW_UID: "50000"
    _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_home:/opt/airflow
    - ./data/batch:/data/batch
    - ./reports:/reports
  depends_on:
    - postgres

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: fleet_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - CLUSTER_ID=__S-A13GRh2RuFee_XVDsQ
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    container_name: fleet_postgres
    environment:
      POSTGRES_DB: fleetdb
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./storage/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleetdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  streaming-producer:
    build: ./producers
    container_name: fleet_streaming_producer
    command: ["python", "streaming_producer.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_NAME: trip_events
      EVENT_INTERVAL_SECONDS: "2"
    depends_on:
      kafka:
        condition: service_healthy

  batch-producer:
    build: ./producers
    container_name: fleet_batch_producer
    command: ["python", "batch_producer.py"]
    environment:
      BATCH_OUTPUT_DIR: /data/batch
      SIMULATED_DAY_SECONDS: "300"
    volumes:
      - ./data/batch:/data/batch

  spark-job:
    build: ./streaming
    container_name: fleet_spark_job
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_NAME: trip_events
      POSTGRES_URL: jdbc:postgresql://postgres:5432/fleetdb
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build: ./api
    container_name: fleet_api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleetdb
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    depends_on:
      postgres:
        condition: service_healthy

  watchdog:
    build: ./observability
    container_name: fleet_watchdog
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleetdb
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      STALE_THRESHOLD_SECONDS: "60"
      CHECK_INTERVAL_SECONDS: "20"
      IDLE_THRESHOLD_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    container_name: fleet_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-standalone:
    <<: *airflow-common
    container_name: fleet_airflow
    command: standalone
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
      - postgres

volumes:
  kafka_data:
  pg_data:
  airflow_home:
